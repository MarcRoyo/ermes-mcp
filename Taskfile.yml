# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  deps:lock:
    desc: Update Poetry lock file
    cmds:
      - poetry lock

  deps:install:
    desc: Install Python dependencies
    cmds:
      - poetry install

  check:
    desc: Validate project dependencies
    cmds:
      - poetry check

  prepare:
    desc: Prepare MCP server for build
    cmds:
      - |
        if [ ! -f poetry.lock ]; then
          echo "poetry.lock not found. Generating it..."
          poetry lock
        elif ! poetry check --lock >/dev/null 2>&1; then
          echo "poetry.lock is out of date. Regenerating it..."
          poetry lock
        else
          echo "poetry.lock is up to date."
        fi
      - poetry check